<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chem Lab bilingüe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Cuaderno de laboratorio por misiones: cada tipo de compuesto tiene su color fijo (como en la tabla periódica) en todo el sitio */
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#16181D; --soft:#5B6270; --line:#DDE2EA; --accent:#3D3BD6; --accent-ink:#FFFFFF;
  --ok:#1E8E4E; --bad:#C7362F; --warn:#B86E00;
  --t-simple:#6B7280; --t-oxido:#E07A12; --t-hidruro:#0F9C96; --t-hidracido:#7C4DEB; --t-salbin:#2470E0;
  --t-hidroxido:#24A055; --t-oxoacido:#D93D67; --t-oxosal:#4B44D9; --t-otras:#A8711A;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1116; --card:#181B22; --ink:#ECEFF4; --soft:#A2AAB8; --line:#2A2F3A; --accent:#8C8AFF; --accent-ink:#0F1116;
  --ok:#4CC584; --bad:#FF6B63; --warn:#F2A93B;
  --t-simple:#9CA3AF; --t-oxido:#FF9A3D; --t-hidruro:#2CC7C0; --t-hidracido:#A27BFF; --t-salbin:#5A9BFF;
  --t-hidroxido:#46C97A; --t-oxoacido:#FF6B90; --t-oxosal:#8A84FF; --t-otras:#E0A445; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1116; --card:#181B22; --ink:#ECEFF4; --soft:#A2AAB8; --line:#2A2F3A; --accent:#8C8AFF; --accent-ink:#0F1116;
  --ok:#4CC584; --bad:#FF6B63; --warn:#F2A93B;
  --t-simple:#9CA3AF; --t-oxido:#FF9A3D; --t-hidruro:#2CC7C0; --t-hidracido:#A27BFF; --t-salbin:#5A9BFF;
  --t-hidroxido:#46C97A; --t-oxoacido:#FF6B90; --t-oxosal:#8A84FF; --t-otras:#E0A445; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,3.4vw,1.9rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0;max-width:66ch}
.f{font-family:var(--mono);font-weight:700;letter-spacing:.01em}
.en{font-style:italic}
.en::before{content:"EN";font:700 .64rem var(--body);font-style:normal;letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marcador{display:flex;gap:14px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.nivel{display:grid;gap:4px;min-width:180px}
.nivel small{color:var(--soft);font-weight:400}
.barra{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.racha{padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.92rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button .pt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

.panel{display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tipo{border-left:6px solid var(--c,var(--accent))}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.ojo{background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:10px;padding:10px 12px;font-size:.95rem}
.ojo b{color:var(--warn)}
.ej{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.ej .f{font-size:1.1rem}
.dato{color:var(--soft);font-size:.92rem}
.speak{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:.8rem;font-weight:700;margin-left:6px}
.speak:hover{border-color:var(--accent)}

/* mapa */
.mapa{display:grid;gap:12px}
.rama{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.rama>h3{padding-top:8px}
.hojas{display:flex;flex-wrap:wrap;gap:8px}
.hoja{border:2px solid var(--c);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;display:grid;gap:2px;min-width:0}
.hoja:hover{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.hoja b{font-family:var(--display)}
.hoja span{font-size:.85rem;color:var(--soft)}
@media (max-width:600px){.rama{grid-template-columns:1fr}}

/* tabla de terminaciones */
.puente{width:100%;border-collapse:collapse;font-size:1rem}
.puente th,.puente td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.puente th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.scroll{overflow-x:auto}

/* oxidación */
.ox-q{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ox-q .f{font-size:1.6rem}
.ox-q u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;min-width:56px;font-family:var(--mono)}
.op:hover{border-color:var(--accent)}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.op.mal{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.pasos{font-family:var(--mono);font-size:.95rem;background:var(--bg);border-radius:10px;padding:10px 12px;white-space:pre-wrap}

/* constructor */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ctrl label{display:grid;gap:4px;font-size:.82rem;font-weight:700;color:var(--soft)}
select{font:inherit;font-size:1rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.resultado{display:grid;gap:12px}
.formula-grande{font-family:var(--mono);font-weight:700;font-size:clamp(2.4rem,9vw,4rem);line-height:1}
.nombres{display:grid;gap:8px}
.nombre{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:baseline}
.nombre small{color:var(--soft);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:520px){.nombre{grid-template-columns:1fr;gap:0}}

/* 3D */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
#lienzo{width:100%;height:440px;display:block;border-radius:14px;background:var(--card);border:1px solid var(--line);touch-action:none}
@media (max-width:820px){#lienzo{height:340px}}
.mols{display:flex;flex-wrap:wrap;gap:6px}
.mols button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-weight:700}
.mols button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.leyenda i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--line)}

/* tarjetas */
.flash{perspective:1000px;cursor:pointer;min-height:220px}
.flash-in{position:relative;width:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d}
.flash.vuelta .flash-in{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;text-align:center;padding:20px;border:2px solid var(--line);background:var(--card)}
.cara.atras{transform:rotateY(180deg);background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:var(--accent)}
.cara .t{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800}
.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

/* desafío */
.preg{font-size:1.25rem;font-weight:700}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.prog i.ok{background:var(--ok)} .prog i.mal{background:var(--bad)} .prog i.ya{background:var(--accent)}
.opciones{display:grid;gap:8px}
.opcion{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1.05rem}
.opcion:hover{border-color:var(--accent)}
.opcion.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opcion.mal{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.feedback{border-radius:12px;padding:12px 14px;background:var(--bg)}

/* IA */
.chat{display:grid;gap:10px}
.chat textarea{font:inherit;width:100%;min-height:80px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.sug{display:flex;flex-wrap:wrap;gap:8px}
.sug button{border:1px dashed var(--accent);background:transparent;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.respuesta{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;min-height:60px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}

.lecs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lec{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;border-left:8px solid var(--c)}
.lec:hover{border-color:var(--c)}
.lec b{font-family:var(--display);font-size:1.15rem}
.lec small{color:var(--soft)}
.paso{display:grid;gap:8px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);animation:entra .35s ease}
@keyframes entra{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.paso .en-t{font-size:1.18rem;line-height:1.5}
.es-t{color:var(--soft);font-size:.98rem;border-left:3px solid var(--accent);padding-left:10px}
.paso.q{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 9px;cursor:pointer;font-size:.8rem;font-weight:700}
.sub-sel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.sub-sel button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;cursor:pointer;font-weight:700;font-size:.85rem}
.sub-sel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hilo{display:grid;gap:12px}

/* paso a paso */
.mapa-ruta{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.parada{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;cursor:pointer}
.parada:hover{border-color:var(--c)}
.parada .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 1.4rem var(--display);background:var(--c);color:#fff}
.parada b{display:block;font-family:var(--display);font-size:1.05rem}
.parada small{display:block;color:var(--soft);font-size:.8rem}
.parada.hecha{border-color:var(--ok)} .parada.hecha .num{background:var(--ok)}
.parada.bloq{opacity:.5;cursor:default} .parada.bloq .num{background:var(--line);color:var(--soft)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)} .dots i.ok{background:var(--ok)} .dots i.ya{background:var(--accent);transform:scale(1.3)}
.vc{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:18px;display:grid;gap:12px;max-width:720px;margin:0 auto;width:100%}
.vis{background:var(--bg);border-radius:14px;padding:8px}
.vt{font-size:clamp(1.35rem,4.5vw,1.8rem);font-weight:800}
.vx{font-size:1.12rem;line-height:1.5}
.enbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:12px;padding:10px 12px}
.enbar .pill{font:800 .7rem var(--body);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:6px}
.enbar b{font-size:1.1rem}
.en-frase{font-style:italic;flex-basis:100%}
.ops.grande .op{font-size:1.15rem;padding:12px 20px;min-width:90px;font-family:var(--body)}
.serie-item{font-family:var(--mono);font-weight:700;font-size:clamp(1.8rem,7vw,2.6rem);text-align:center;padding:10px;border-radius:14px;background:var(--bg)}
@keyframes gira{to{transform:rotate(360deg)}} .gira{animation:gira 10s linear infinite}
@keyframes vib{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-3px)}} .vib{animation:vib 1.6s ease-in-out infinite}
@keyframes jI{0%,25%{transform:translateX(0)}60%,100%{transform:translateX(102px)}} .junta-i{animation:jI 4s ease-in-out infinite alternate}
@keyframes jD{0%,25%{transform:translateX(0)}60%,100%{transform:translateX(-102px)}} .junta-d{animation:jD 4s ease-in-out infinite alternate}
@keyframes ap{0%,55%{opacity:0}75%,100%{opacity:1}} .aparece{animation:ap 4s ease-in-out infinite alternate}
@keyframes br{0%,100%{opacity:.3}50%{opacity:1}} .brilla{animation:br 1.4s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} .flota{animation:fl 3s ease-in-out infinite}
@keyframes vj{0%,20%{transform:translateX(0)}70%,100%{transform:translate(125px,-55px)}} .viaja{animation:vj 3s ease-in-out infinite}
@keyframes atr{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.85)}} .atrae{animation:atr 1.6s ease-in-out infinite;transform-origin:200px 110px}
@keyframes bal{0%{transform:rotate(-8deg)}60%,100%{transform:rotate(0)}} .balancea{animation:bal 2.5s ease-out infinite alternate}
@keyframes dib{from{stroke-dasharray:0 400}to{stroke-dasharray:400 0}} .dibuja{animation:dib 2.5s ease-in-out infinite alternate}
@media (max-width:600px){.top{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="fila">
      <div><h1>Chem Lab <span style="color:var(--accent)">bilingüe</span></h1></div>
      <div class="marcador">
        <div class="nivel"><span id="nivelNombre">Nivel 1 · Átomo</span><div class="barra"><i id="nivelBarra"></i></div><small id="xpTxt">0 XP</small></div>
        <span class="racha" id="racha" title="Respuestas seguidas bien">Racha 0</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <main id="vista" class="panel"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= DATOS QUÍMICOS ================= */
const T = { // tipos de compuesto: color, nombre ES, nombre EN
  simple:{c:"--t-simple",es:"Sustancia simple",en:"Element (simple substance)"},
  oxido:{c:"--t-oxido",es:"Óxido",en:"Oxide"},
  hidruro:{c:"--t-hidruro",es:"Hidruro metálico",en:"Metal hydride"},
  hidracido:{c:"--t-hidracido",es:"Hidrácido",en:"Binary acid (hydracid)"},
  comun:{c:"--t-hidracido",es:"Compuesto de H con nombre común",en:"Hydrogen compound (common name)"},
  salbin:{c:"--t-salbin",es:"Sal binaria",en:"Binary salt"},
  hidroxido:{c:"--t-hidroxido",es:"Hidróxido",en:"Hydroxide (base)"},
  oxoacido:{c:"--t-oxoacido",es:"Oxoácido",en:"Oxoacid (oxyacid)"},
  oxosal:{c:"--t-oxosal",es:"Oxosal",en:"Oxosalt (oxysalt)"},
  hidrogenosal:{c:"--t-otras",es:"Hidrogenosal",en:"Hydrogen salt (acid salt)"},
  amonio:{c:"--t-otras",es:"Sal de amonio",en:"Ammonium salt"}
};
const ROM=["","I","II","III","IV","V","VI","VII"];
const METALES=[
  {s:"Li",es:"litio",en:"lithium",ox:[1]},{s:"Na",es:"sodio",en:"sodium",ox:[1]},{s:"K",es:"potasio",en:"potassium",ox:[1]},
  {s:"Ag",es:"plata",en:"silver",ox:[1]},{s:"Mg",es:"magnesio",en:"magnesium",ox:[2]},{s:"Ca",es:"calcio",en:"calcium",ox:[2]},
  {s:"Ba",es:"bario",en:"barium",ox:[2]},{s:"Zn",es:"zinc",en:"zinc",ox:[2]},{s:"Al",es:"aluminio",en:"aluminum",ox:[3]},
  {s:"Ga",es:"galio",en:"gallium",ox:[3]},
  {s:"Cu",es:"cobre",en:"copper",ox:[1,2],tes:["cuproso","cúprico"],ten:["cuprous","cupric"]},
  {s:"Fe",es:"hierro",en:"iron",ox:[2,3],tes:["ferroso","férrico"],ten:["ferrous","ferric"]},
  {s:"Pb",es:"plomo",en:"lead",ox:[2,4],tes:["plumboso","plúmbico"],ten:["plumbous","plumbic"]},
  {s:"Sn",es:"estaño",en:"tin",ox:[2,4],tes:["estannoso","estánnico"],ten:["stannous","stannic"]},
  {s:"Au",es:"oro",en:"gold",ox:[1,3],tes:["auroso","áurico"],ten:["aurous","auric"]},
  {s:"Ni",es:"níquel",en:"nickel",ox:[2,3],tes:["niqueloso","niquélico"],ten:["nickelous","nickelic"]},
  {s:"Co",es:"cobalto",en:"cobalt",ox:[2,3],tes:["cobaltoso","cobáltico"],ten:["cobaltous","cobaltic"]},
  {s:"Pt",es:"platino",en:"platinum",ox:[2,4],tes:["platinoso","platínico"],ten:["platinous","platinic"]},
  {s:"Pd",es:"paladio",en:"palladium",ox:[2,4],tes:["paladioso","paládico"],ten:["palladous","palladic"]},
  {s:"Ti",es:"titanio",en:"titanium",ox:[3,4],tes:["titanoso","titánico"],ten:["titanous","titanic"]}
];
const NOMETALES=[
  {s:"C",es:"carbono",en:"carbon",ox:[2,4]},{s:"Si",es:"silicio",en:"silicon",ox:[4]},

  {s:"Cl",es:"cloro",en:"chlorine",ox:[1,3,5,7]},{s:"Br",es:"bromo",en:"bromine",ox:[1,3,5,7]},{s:"I",es:"iodo",en:"iodine",ox:[1,3,5,7]}
];

const ANIONES=[

  {s:"I",q:1,es:"ioduro",en:"iodide"},{s:"S",q:2,es:"sulfuro",en:"sulfide"},{s:"Se",q:2,es:"seleniuro",en:"selenide"},

];
const HIDRACIDOS=[
  {f:[["H"],["F"]],es:["fluoruro de hidrógeno","ácido fluorhídrico"],en:["hydrogen fluoride","hydrofluoric acid"],x:"F",ox:-1},
  {f:[["H"],["Cl"]],es:["cloruro de hidrógeno","ácido clorhídrico"],en:["hydrogen chloride","hydrochloric acid"],x:"Cl",ox:-1},
  {f:[["H"],["Br"]],es:["bromuro de hidrógeno","ácido bromhídrico"],en:["hydrogen bromide","hydrobromic acid"],x:"Br",ox:-1},

];
const COMUNES=[
  {f:[["H",2],["O"]],es:"agua",en:"water",x:"O",ox:-2},{f:[["N"],["H",3]],es:"amoníaco",en:"ammonia",x:"N",ox:-3},
  {f:[["C"],["H",4]],es:"metano",en:"methane",x:"C",ox:-4},{f:[["P"],["H",3]],es:"fosfina",en:"phosphine",x:"P",ox:-3},

];
// oxoácidos: no metal + número -> fórmula (H, X, O), nombres y su oxoanión
const OXO=[
  ["C",4,2,3,"carbónico","carbonic","carbonato","carbonate"],["Si",4,2,3,"silícico","silicic","silicato","silicate"],
  ["N",3,1,2,"nitroso","nitrous","nitrito","nitrite"],["N",5,1,3,"nítrico","nitric","nitrato","nitrate"],
  ["P",3,3,3,"fosforoso","phosphorous","fosfito","phosphite"],["P",5,3,4,"fosfórico","phosphoric","fosfato","phosphate"],
  ["S",4,2,3,"sulfuroso","sulfurous","sulfito","sulfite"],["S",6,2,4,"sulfúrico","sulfuric","sulfato","sulfate"],
  ["Se",4,2,3,"selenioso","selenous","selenito","selenite"],["Se",6,2,4,"selénico","selenic","selenato","selenate"],
  ["Cl",1,1,1,"hipocloroso","hypochlorous","hipoclorito","hypochlorite"],["Cl",3,1,2,"cloroso","chlorous","clorito","chlorite"],
  ["Cl",5,1,3,"clórico","chloric","clorato","chlorate"],["Cl",7,1,4,"perclórico","perchloric","perclorato","perchlorate"],
  ["Br",1,1,1,"hipobromoso","hypobromous","hipobromito","hypobromite"],["Br",3,1,2,"bromoso","bromous","bromito","bromite"],
  ["Br",5,1,3,"brómico","bromic","bromato","bromate"],["Br",7,1,4,"perbrómico","perbromic","perbromato","perbromate"],
  ["I",1,1,1,"hipoiodoso","hypoiodous","hipoiodito","hypoiodite"],["I",3,1,2,"iodoso","iodous","iodito","iodite"],
  ["I",5,1,3,"iódico","iodic","iodato","iodate"],["I",7,1,4,"periódico","periodic","periodato","periodate"]
].map(([x,ox,h,o,aes,aen,ses,sen])=>({x,ox,h,o,aes,aen,ses,sen}));

/* ================= MOTOR DE NOMENCLATURA ================= */
const gcd=(a,b)=>b?gcd(b,a%b):a;
const sub=n=>n>1?`<sub>${n}</sub>`:"";
// fórmula: lista de partes [símbolo|grupo, cantidad]; grupo = lista de partes
function fHTML(p){return p.map(([s,n=1])=>Array.isArray(s)?(n>1?`(${fHTML(s)})${sub(n)}`:fHTML(s)):`${s}${sub(n)}`).join("")}
function fTXT(p){return p.map(([s,n=1])=>Array.isArray(s)?(n>1?`(${fTXT(s)})${n}`:fTXT(s)):`${s}${n>1?n:""}`).join("")}
const PRE_ES=["","mono","di","tri","tetra","penta","hexa","hepta"], PRE_EN=PRE_ES;
const oxES=n=>({1:"monóxido",2:"dióxido",3:"trióxido",4:"tetróxido",5:"pentóxido",6:"hexóxido",7:"heptóxido"})[n];
const oxEN=n=>({1:"monoxide",2:"dioxide",3:"trioxide",4:"tetroxide",5:"pentoxide",6:"hexoxide",7:"heptoxide"})[n];
const sg=n=>n>0?`+${n}`:n<0?`−${-n}`:"0";
function nombresMetal(m,ox,nounES,nounEN){
  if(m.ox.length===1) return {es:[`${nounES} de ${m.es}`],en:[`${m.en} ${nounEN}`],nom:["Nombre único"]};
  const i=m.ox.indexOf(ox);
  return {es:[`${nounES} de ${m.es} (${ROM[ox]})`,`${nounES} ${m.tes[i]}`],en:[`${m.en}(${ROM[ox]}) ${nounEN}`,`${m.ten[i]} ${nounEN}`],nom:["Stock","Tradicional"]};
}
function cruce(sa,a,sb,b){const g=gcd(a,b);return {x:b/g,y:a/g,txt:`${sa} usa ${sg(a)} y ${sb} usa ${sg(-b)}. Se cruzan los números: ${sa}${b>1?b:""}${sb}${a>1?a:""}${g>1?` y se simplifica ÷${g}`:""}. Control: ${b/g}·(${sg(a)}) + ${a/g}·(${sg(-b)}) = 0 ✔`};}

const GEN={
  oxidoMetal(m,ox){const c=cruce(m.s,ox,"O",2),n=nombresMetal(m,ox,"óxido","oxide");
    if(m.ox.length>1){n.es.push(`${oxES(c.y)} de ${c.x>1?PRE_ES[c.x]:""}${m.es}`);n.en.push(`${c.x>1?PRE_EN[c.x]:""}${m.en} ${oxEN(c.y)}`);n.nom.push("Atomicidad")}
    return {tipo:"oxido",sub:"Óxido básico · basic oxide",p:[[m.s,c.x],["O",c.y]],...n,ox:{[m.s]:ox,O:-2},central:m.s,expl:c.txt}},
  oxidoNoMetal(x,ox){const c=cruce(x.s,ox,"O",2);
    const es=[`óxido de ${x.es} (${ROM[ox]})`,`${oxES(c.y)} de ${c.x>1?PRE_ES[c.x]:""}${x.es}`],en=[`${x.en}(${ROM[ox]}) oxide`,`${c.x>1?PRE_EN[c.x]:""}${x.en} ${oxEN(c.y)}`];
    if(x.ox.length===1){es[0]=`óxido de ${x.es}`;en[0]=`${x.en} oxide`}
    return {tipo:"oxido",sub:"Óxido ácido · acidic oxide",p:[[x.s,c.x],["O",c.y]],es,en,nom:[x.ox.length===1?"Nombre único":"Stock","Atomicidad"],ox:{[x.s]:ox,O:-2},central:x.s,expl:c.txt}},
  hidruro(m,ox){const n=nombresMetal(m,ox,"hidruro","hydride");
    return {tipo:"hidruro",p:[[m.s],["H",ox]],...n,ox:{[m.s]:ox,H:-1},central:m.s,expl:`En los hidruros metálicos el H usa −1. ${m.s} usa ${sg(ox)}, así que lleva ${ox} H: ${m.s}H${ox>1?ox:""}.`}},
  salbin(m,ox,a){const c=cruce(m.s,ox,a.s,a.q),n=nombresMetal(m,ox,a.es,a.en);
    return {tipo:"salbin",p:[[m.s,c.x],[a.s,c.y]],...n,ox:{[m.s]:ox,[a.s]:-a.q},central:m.s,expl:c.txt}},
  hidroxido(m,ox){const n=nombresMetal(m,ox,"hidróxido","hydroxide");
    return {tipo:"hidroxido",p:[[m.s],[[["O"],["H"]],ox]],...n,ox:{[m.s]:ox,O:-2,H:1},central:m.s,expl:`El grupo OH tiene carga −1 (ion hidróxido). ${m.s} usa ${sg(ox)}, así que lleva ${ox} grupo${ox>1?"s":""} OH${ox>1?" (con paréntesis)":""}.`}},
  oxoacido(o){const x=NOMETALES.find(n=>n.s===o.x);
    return {tipo:"oxoacido",p:[["H",o.h],[o.x],["O",o.o]],es:[`ácido ${o.aes}`],en:[`${o.aen} acid`],nom:["Tradicional"],ox:{H:1,[o.x]:o.ox,O:-2},central:o.x,
      expl:`Control: ${o.h}·(+1) + (${sg(o.ox)}) + ${o.o}·(−2) = 0 ✔. ${x.es[0].toUpperCase()+x.es.slice(1)} con ${sg(o.ox)} → terminación del nombre según la tabla (hipo-oso / -oso / -ico / per-ico).`}},
  oxosal(m,ox,o){const q=o.h,c=cruce(m.s,ox,"anión",q),an=[[o.x],["O",o.o]],n=nombresMetal(m,ox,o.ses,o.sen);
    return {tipo:"oxosal",p:[[m.s,c.x],[an,c.y]],...n,ox:{[m.s]:ox,[o.x]:o.ox,O:-2},central:o.x,
      expl:`El ácido ${o.aes} (${fTXT([["H",o.h],[o.x],["O",o.o]])}) pierde sus ${o.h} H y queda el anión ${o.ses} ${fTXT(an)} con carga −${q}. ${m.s} usa ${sg(ox)}: se cruzan y queda ${fTXT([[m.s,c.x],[an,c.y]])}.`}},
  hidrogenosal(m,ox,x){const nm=x==="S"?["sulfuro","sulfide"]:["seleniuro","selenide"];const n=nombresMetal(m,ox,"hidrogeno"+nm[0],"hydrogen "+nm[1]);
    n.es=n.es.concat(m.ox.length===1?[`${nm[0]} ácido de ${m.es}`]:[]);if(m.ox.length===1)n.nom.push("Otra forma");
    return {tipo:"hidrogenosal",p:[[m.s],[[["H"],[x]],ox]],...n,ox:{[m.s]:ox,H:1,[x]:-2},central:m.s,expl:`El anión H${x} tiene carga −1 (${x} con −2 y H con +1). ${m.s} usa ${sg(ox)}: lleva ${ox} grupo${ox>1?"s":""} H${x}.`}},
  amonio(a){const p=[[[["N"],["H",4]],a.q],[a.s]];
    return {tipo:"amonio",p,es:[`${a.es} de amonio`],en:[`ammonium ${a.en}`],nom:["Nombre"],ox:{N:-3,H:1,[a.s]:-a.q},central:a.s,expl:`El catión amonio NH₄⁺ tiene carga +1. ${a.es[0].toUpperCase()+a.es.slice(1)} tiene −${a.q}: hacen falta ${a.q} amonio${a.q>1?"s":""}.`}}
};
const mkHidracido=h=>({tipo:"hidracido",p:h.f,es:h.es,en:h.en,nom:["Gaseoso (g)","Disuelto en agua (ac)"],ox:{H:1,[h.x]:h.ox},central:h.x,expl:`El no metal usa su número NEGATIVO (${sg(h.ox)}) y el H +1.`});
const mkComun=c=>({tipo:"comun",p:c.f,es:[c.es],en:[c.en],nom:["Nombre común"],ox:{[c.x]:c.ox},central:c.x,expl:"Tienen nombres propios: se aprenden de memoria."});

// todos los compuestos posibles (para el desafío)
function todos(){const L=[];
  METALES.forEach(m=>m.ox.forEach(ox=>{L.push(GEN.oxidoMetal(m,ox),GEN.hidruro(m,ox),GEN.hidroxido(m,ox));
    ANIONES.forEach(a=>L.push(GEN.salbin(m,ox,a)));OXO.forEach(o=>L.push(GEN.oxosal(m,ox,o)));
    if(ox<=2)["S"].forEach(x=>L.push(GEN.hidrogenosal(m,ox,x)));}));
  NOMETALES.forEach(x=>x.ox.forEach(ox=>L.push(GEN.oxidoNoMetal(x,ox))));
  OXO.forEach(o=>L.push(GEN.oxoacido(o)));HIDRACIDOS.forEach(h=>L.push(mkHidracido(h)));COMUNES.forEach(c=>L.push(mkComun(c)));
  ANIONES.filter(a=>["F","Cl","Br","I","S"].includes(a.s)).forEach(a=>L.push(GEN.amonio(a)));
  L.forEach(c=>{c.ft=fTXT(c.p);c.fh=fHTML(c.p)});return L;}
const TODOS=todos();

ox(){const P=[

    <article class="card"><h2>Número de oxidación</h2><p class="en">oxidation number (or oxidation state)</p>

  ["p","<span class='f'>NaOH</span> is <b>caustic soda</b>. Hydroxides are <b>caustic</b>: they can burn your skin.","El NaOH es la <b>soda cáustica</b>. Los hidróxidos son <b>cáusticos</b>: pueden quemar la piel."],
  ["p","An <b>oxoacid</b> has three elements: hydrogen + a nonmetal + oxygen. Example: <span class='f'>H₂SO₄</span>, sulfuric acid.","Un <b>oxoácido</b> tiene tres elementos: hidrógeno + no metal + oxígeno. Ejemplo: H₂SO₄, ácido sulfúrico."],
  ["p","The ending tells the number: <b>-ous</b> for the lower one, <b>-ic</b> for the higher one.","La terminación dice el número: <b>-oso</b> para el menor, <b>-ico</b> para el mayor."],
  ["q","Sulfur is +4 in <span class='f'>H₂SO₃</span> and +6 in <span class='f'>H₂SO₄</span>. H₂SO₃ is…","El azufre es +4 en H₂SO₃ y +6 en H₂SO₄. El H₂SO₃ es…",["sulfuric acid","sulfurous acid"],1,"+4 is the lower → <b>sulfurous acid</b> (ácido sulfuroso).","+4 es el menor → <b>ácido sulfuroso</b> (sulfurous acid)."],
  ["p","Chlorine, bromine and iodine have four: <b>hypo-…-ous</b> (+1), <b>-ous</b> (+3), <b>-ic</b> (+5), <b>per-…-ic</b> (+7).","Cloro, bromo y iodo tienen cuatro: <b>hipo-…-oso</b> (+1), <b>-oso</b> (+3), <b>-ico</b> (+5), <b>per-…-ico</b> (+7)."],
  ["q","Find Cl in <span class='f'>HClO₃</span>: (+1) + Cl + 3·(−2) = 0","Calculá el Cl en HClO₃: (+1) + Cl + 3·(−2) = 0",["+3","+5","+6"],1,"1 + Cl − 6 = 0 → Cl = <b>+5</b> → chloric acid (ácido clórico).","1 + Cl − 6 = 0 → Cl = <b>+5</b> → ácido clórico (chloric acid)."],

  ["p","The ending changes: <b>-ous → -ite</b> and <b>-ic → -ate</b>. Spanish does the same: -oso → -ito, -ico → -ato.","Cambia la terminación: <b>-ous → -ite</b> y <b>-ic → -ate</b>. En castellano igual: -oso → -ito, -ico → -ato."],
  ["q","Nitric acid, <span class='f'>HNO₃</span>, loses its H. The anion is…","El ácido nítrico, HNO₃, pierde su H. El anión es…",["nitrite","nitrate","nitride"],1,"-ic → <b>-ate</b>: nitrate (nitrato).","-ico → <b>-ato</b>: nitrato (nitrate)."],
  ["p","An <b>oxosalt</b> is a metal + an oxoanion. Example: <span class='f'>Fe(NO₃)₃</span>, iron(III) nitrate or ferric nitrate.","Una <b>oxosal</b> es metal + oxoanión. Ejemplo: Fe(NO₃)₃, nitrato de hierro (III) o nitrato férrico."],
  ["q","Calcium (+2) + phosphate (<span class='f'>PO₄³⁻</span>). The formula is…","Calcio (+2) + fosfato (PO₄³⁻). La fórmula es…",["CaPO₄","Ca₃(PO₄)₂","Ca₂(PO₄)₃"],1,"Cross 2 and 3: <span class='f'>Ca₃(PO₄)₂</span>. 3·(+2) + 2·(−3) = 0 ✔","Se cruzan 2 y 3: Ca₃(PO₄)₂. 3·(+2) + 2·(−3) = 0 ✔"],

  ["q","<span class='f'>(NH₄)₂S</span> is…","El (NH₄)₂S es…",["ammonium sulfate","ammonium sulfide","ammonia sulfur"],1,"S alone → <b>-ide</b>: ammonium sulfide (sulfuro de amonio). Sulfate would be SO₄.","S solo → <b>-ide</b>: sulfuro de amonio (ammonium sulfide). Sulfato sería SO₄."],

let subModo="toque";try{subModo=localStorage.getItem("chemlab-sub")||"toque"}catch(e){}
const plano=h=>h.replace(/<[^>]+>/g,"").replace(/·/g," times ").replace(/−/g," minus ").replace(/₂/g,"2").replace(/₃/g,"3").replace(/₄/g,"4").replace(/[⁺⁻²³]/g,"").replace(/"/g,"");
function lecciones(){const hechas=est.lecs||{};
  vista.innerHTML=`<h2>Lessons <span class="en" style="font-size:1rem;font-weight:400">Lecciones en inglés, con subtítulos</span></h2>
  <p>Short steps in English. Tap <b>ES</b> if you need the Spanish subtitle. Answer the questions to keep going.</p>
  <p class="dato">Pasos cortos en inglés. Tocá <b>ES</b> si necesitás el subtítulo. Contestá las preguntas para avanzar.</p>
  <div class="lecs">${LECS.map((l,i)=>`<button class="lec" style="--c:var(${l.c})" data-lec="${i}"><small>Lesson ${i+1} · ${l.s.filter(x=>x[0]==="q").length} questions</small><b>${l.en}</b><span class="dato">${l.es}</span><small>${hechas[l.id]?"✔ Done · "+hechas[l.id]+" XP":"Not started"}</small></button>`).join("")}</div>`;
  vista.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>leccion(+b.dataset.lec))}
function leccion(i){const L=LECS[i];let k=0,ganado=0;
  vista.innerHTML=`<div class="fila"><h2 style="color:var(${L.c})">${L.en}</h2><button class="btn sec" id="volver">← All lessons</button></div>
   <div class="fila"><div class="prog" id="lprog" style="flex:1;min-width:200px">${L.s.map(()=>"<i></i>").join("")}</div>
   <div class="sub-sel"><span>Subtítulos:</span>${[["toque","al tocar ES"],["siempre","siempre"],["nunca","nunca"]].map(([v,t])=>`<button data-sub="${v}" aria-pressed="${subModo===v}">${t}</button>`).join("")}</div></div>
   <div class="hilo" id="hilo"></div><div class="acciones" style="justify-content:flex-start" id="lacc"></div>`;
  document.getElementById("volver").onclick=lecciones;
  vista.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{subModo=b.dataset.sub;try{localStorage.setItem("chemlab-sub",subModo)}catch(e){}
    vista.querySelectorAll("[data-sub]").forEach(x=>x.setAttribute("aria-pressed",x===b));vista.querySelectorAll(".es-t").forEach(e=>e.hidden=subModo!=="siempre")});
  const hilo=document.getElementById("hilo"),acc=document.getElementById("lacc");
  const mini=(en,idx)=>`<div class="mini"><button data-voz="${plano(en)}">▶ listen</button><button data-es="${idx}">ES</button></div>`;
  hilo.onclick=e=>{const b=e.target.closest("[data-es]");if(b){const t=document.getElementById("es"+b.dataset.es);if(t)t.hidden=!t.hidden}};
  const sigue=()=>{acc.innerHTML=`<button class="btn" id="cont">Continue →</button>`;const c=document.getElementById("cont");c.onclick=paso;c.focus({preventScroll:true})};
  const paso=()=>{const pr=document.querySelectorAll("#lprog i");if(k>=L.s.length){
      est.lecs=est.lecs||{};const prev=est.lecs[L.id]||0;est.lecs[L.id]=Math.max(prev,ganado);sumar(prev?0:20,prev?"Lesson done":"Lesson complete! +20 XP");
      acc.innerHTML=`<div class="card" style="width:100%"><h3>Lesson complete! 🎉 <span class="dato">¡Lección terminada!</span></h3><p>${ganado} XP in this lesson.</p><div class="acciones" style="justify-content:flex-start">${i<LECS.length-1?`<button class="btn" id="nextL">Next lesson →</button>`:""}<button class="btn sec" id="toL">All lessons</button></div></div>`;
      document.getElementById("toL").onclick=lecciones;const n=document.getElementById("nextL");if(n){n.onclick=()=>leccion(i+1);n.focus()}return}
    const s=L.s[k],idx=`${i}_${k}`,ver=subModo==="siempre"?"":"hidden";pr[k].classList.add("ya");
    const d=document.createElement("div");
    if(s[0]==="p"){d.className="paso";d.innerHTML=`<div class="en-t">${s[1]}</div><div class="es-t" id="es${idx}" ${ver}>${s[2]}</div>${mini(s[1],idx)}`;
      hilo.appendChild(d);pr[k].classList.replace("ya","ok");k++;sigue();d.scrollIntoView({behavior:"smooth",block:"nearest"})}
    else{const [,qen,qes,ops,ok,wen,wes]=s;d.className="paso q";
      d.innerHTML=`<div class="en-t"><b>Quick check:</b> ${qen}</div><div class="es-t" id="es${idx}" ${ver}>${qes}</div>${mini(qen,idx)}
        <div class="opciones">${ops.map((o,j)=>`<button class="opcion" data-j="${j}">${o}</button>`).join("")}</div><div class="fb"></div>`;
      hilo.appendChild(d);acc.innerHTML="";d.scrollIntoView({behavior:"smooth",block:"nearest"});let intento=0;
      d.querySelectorAll(".opcion").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;intento++;
        if(j===ok){d.querySelectorAll(".opcion").forEach(x=>x.disabled=true);b.classList.add("ok");const xp=intento===1?10:4;ganado+=xp;est.racha=intento===1?est.racha+1:0;sumar(xp,`+${xp} XP`);
          pr[k].classList.replace("ya",intento===1?"ok":"mal");
          d.querySelector(".fb").innerHTML=`<div class="feedback"><b>${intento===1?"Correct!":"Got it!"}</b> ${wen}<div class="es-t" style="margin-top:6px" id="esw${idx}" ${ver}>${wes}</div><div class="mini" style="margin-top:6px"><button data-es="w${idx}">ES</button></div></div>`;
          k++;sigue()}
        else{b.classList.add("mal");b.disabled=true;est.racha=0;guardar();pintarNivel();
          d.querySelector(".fb").innerHTML=`<div class="feedback">Not quite, try again! <span class="dato">Casi, probá de nuevo.</span></div>`}})}};
  paso()}

 {id:"e1",g:"ingles",c:"--t-salbin",en:"Ionic compounds",es:"Compuestos iónicos",s:[

  ["q","Why do ionic compounds have high melting points?","¿Por qué los compuestos iónicos tienen puntos de fusión altos?",["The ionic bonds are strong","The ions are very small","They have no charge"],0,"Breaking many <b>strong</b> ionic bonds needs a lot of energy.","Romper muchos enlaces iónicos <b>fuertes</b> necesita mucha energía."],

 {id:"e2",g:"ingles",c:"--t-hidruro",en:"Covalent bonding",es:"Enlace covalente",s:[
  ["p","Nonmetal atoms <b>share</b> electrons. A shared pair of electrons is a <b>covalent bond</b>.","Los átomos no metálicos <b>comparten</b> electrones. Un par compartido de electrones es un <b>enlace covalente</b>."],

  ["p","Sometimes atoms share two pairs: a <b>double bond</b>. Oxygen, <span class='f'>O₂</span>, has a double bond.","A veces comparten dos pares: un <b>enlace doble</b>. El oxígeno, O₂, tiene un enlace doble."],
  ["p","Small molecules have <b>low melting and boiling points</b>. Many are gases or liquids. They <b>do not conduct</b> electricity.","Las moléculas chicas tienen <b>puntos de fusión y ebullición bajos</b>. Muchas son gases o líquidos. <b>No conducen</b> la electricidad."],

 {id:"e3",g:"ingles",c:"--t-oxido",en:"Introduction to moles",es:"Introducción a los moles",s:[

const DC={
 "NaCl":{n:"sodium chloride",es:"cloruro de sodio",a:[["Na",1,1,"2,8,1","2,8"],["Cl",0,7,"2,8,7","2,8,8"]]},
 "MgO":{n:"magnesium oxide",es:"óxido de magnesio",a:[["Mg",1,2,"2,8,2","2,8"],["O",0,6,"2,6","2,8"]]},
 "MgCl₂":{n:"magnesium chloride",es:"cloruro de magnesio",a:[["Cl",0,7,"2,8,7","2,8,8"],["Mg",1,2,"2,8,2","2,8"],["Cl",0,7,"2,8,7","2,8,8"]]},
 "Na₂O":{n:"sodium oxide",es:"óxido de sodio",a:[["Na",1,1,"2,8,1","2,8"],["O",0,6,"2,6","2,8"],["Na",1,1,"2,8,1","2,8"]]},
 "KBr":{n:"potassium bromide",es:"bromuro de potasio",a:[["K",1,1,"2,8,8,1","2,8,8"],["Br",0,7,"7 outer","8 outer"]]},
 "K₂O":{n:"potassium oxide",es:"óxido de potasio",a:[["K",1,1,"2,8,8,1","2,8,8"],["O",0,6,"2,6","2,8"],["K",1,1,"2,8,8,1","2,8,8"]]}
};
const SUPQ=n=>({1:"",2:"²",3:"³"})[n]||"";
function vistaDot(){let caso="NaCl";
  vista.innerHTML=`<h2>Dot &amp; cross <span class="en" style="font-size:1rem;font-weight:400">Diagramas de puntos y cruces</span></h2>
  <p>Dots (<b style="color:#2F6BFF">●</b>) are the metal's electrons. Crosses (<b style="color:#D9333F">×</b>) are the non-metal's electrons. Only the <b>outer shell</b> is shown.</p>
  <p class="dato">Los puntos son los electrones del metal; las cruces, los del no metal. Solo se dibuja la última capa.</p>
  <div class="mols" id="dcs">${Object.keys(DC).map(k=>`<button data-k="${k}" aria-pressed="${k===caso}">${k}</button>`).join("")}</div>
  <section class="card" style="gap:12px"><div class="scroll"><svg id="dcsvg" viewBox="0 52 600 175" style="width:100%;min-width:420px;height:auto"></svg></div>
    <div class="acciones" style="justify-content:flex-start"><button class="btn" id="tr">Transfer electrons</button><button class="btn sec" id="rs">Reset</button></div>
    <div id="dctx" class="feedback"></div></section>`;
  const svg=document.getElementById("dcsvg");
  const dibujar=()=>{const c=DC[caso],n=c.a.length,R=40;const xs=c.a.map((_,i)=>n===1?300:90+i*(420/(n-1)));
    let h="";const need=c.a.map(a=>a[1]?0:8-a[2]);const libres=c.a.map((a,i)=>a[1]?[]:Array.from({length:8},(_,k)=>k).slice(a[2]).map(k=>{const t=-Math.PI/2+k*Math.PI/4;return [xs[i]+R*Math.cos(t),110+R*Math.sin(t)]}));
    c.a.forEach((a,i)=>{const [s,met,o,conf]=a;h+=`<circle class="capa${i}" cx="${xs[i]}" cy="110" r="${R}" fill="none" stroke="var(--soft)" stroke-width="1.6" style="transition:opacity .8s"/>
      <text x="${xs[i]}" y="116" text-anchor="middle" font-family="var(--mono)" font-weight="700" font-size="18" fill="var(--ink)">${s}</text>
      <text class="lab${i}" x="${xs[i]}" y="186" text-anchor="middle" font-size="13" fill="var(--soft)">${conf}</text>
      <text class="ion${i}" x="${xs[i]}" y="212" text-anchor="middle" font-family="var(--mono)" font-weight="700" font-size="16" fill="var(--ink)" opacity="0" style="transition:opacity .8s"></text>`;
      if(!met)for(let k=0;k<o;k++){const t=-Math.PI/2+k*Math.PI/4;h+=`<text x="${xs[i]+R*Math.cos(t)}" y="${110+R*Math.sin(t)+5}" text-anchor="middle" font-size="16" font-weight="700" fill="#D9333F">×</text>`}});
    // electrones del metal (puntos) que se van a mover
    const mov=[];c.a.forEach((a,i)=>{if(!a[1])return;for(let k=0;k<a[2];k++){
      const dest=c.a.map((b,j)=>[j,Math.abs(j-i)]).filter(([j])=>need[j]>0).sort((p,q)=>p[1]-q[1])[0];
      const hacia=dest&&xs[dest[0]]<xs[i]?Math.PI:0;                         // el punto arranca del lado del no metal
      const t=hacia+(k-(a[2]-1)/2)*0.9,x=xs[i]+R*Math.cos(t),y=110+R*Math.sin(t);let tx=x,ty=y;
      if(dest){const j=dest[0];need[j]--;const [lx,ly]=libres[j].shift();tx=lx;ty=ly}
      mov.push([x,y,tx,ty])}});
    mov.forEach(([x,y,tx,ty],m)=>{h+=`<circle class="ele" cx="${x}" cy="${y}" r="6" fill="#2F6BFF" data-dx="${tx-x}" data-dy="${ty-y}" style="transition:transform 1.3s cubic-bezier(.5,0,.2,1) ${m*0.15}s"/>`});
    svg.innerHTML=h;
    document.getElementById("dctx").innerHTML=`<b>${caso}</b> · ${c.n} ${voz(c.n)} · <span class="dato">${c.es}</span><br>Press <b>Transfer</b>. <span class="dato">Tocá Transfer.</span>`};
  const transferir=()=>{const c=DC[caso];svg.querySelectorAll(".ele").forEach(e=>e.style.transform=`translate(${e.dataset.dx}px,${e.dataset.dy}px)`);
    setTimeout(()=>{c.a.forEach((a,i)=>{const [s,met,o,,fin]=a;const q=met?o:8-o;const ion=svg.querySelector(".ion"+i);ion.textContent=`${s}${SUPQ(q)}${met?"⁺":"⁻"}`;ion.setAttribute("opacity","1");
        svg.querySelector(".lab"+i).textContent=fin;if(met)svg.querySelector(".capa"+i).style.opacity=".15"});
      const metal=c.a.find(a=>a[1]),non=c.a.find(a=>!a[1]);const nm=c.a.filter(a=>a[1]).length,nn=c.a.filter(a=>!a[1]).length;
      document.getElementById("dctx").innerHTML=`<b>${caso}</b> · ${c.n} ${voz(c.n)}<br>
        ${nm>1?`Each ${metal[0]} atom`:`The ${metal[0]} atom`} <b>loses ${metal[2]}</b> electron${metal[2]>1?"s":""} → <b>${metal[0]}${SUPQ(metal[2])}⁺</b>. ${nn>1?`Each ${non[0]} atom`:`The ${non[0]} atom`} <b>gains ${8-non[2]}</b> → <b>${non[0]}${SUPQ(8-non[2])}⁻</b>. Opposite charges attract: <b>ionic bond</b>.
        <div class="dato" style="margin-top:6px">${nm>1?`Cada átomo de ${metal[0]}`:`El ${metal[0]}`} <b>pierde ${metal[2]}</b> electrón${metal[2]>1?"es":""} y ${nn>1?`cada ${non[0]}`:`el ${non[0]}`} <b>gana ${8-non[2]}</b>. Las cargas opuestas se atraen: <b>enlace iónico</b>. Las cargas suman cero.</div>`;
      const k="dc"+caso;if(!est.hechos[k]){est.hechos[k]=1;sumar(3,"+3 XP")}},1500+c.a.length*150)};
  document.getElementById("dcs").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;caso=b.dataset.k;document.querySelectorAll("#dcs button").forEach(x=>x.setAttribute("aria-pressed",x===b));dibujar()};
  document.getElementById("tr").onclick=transferir;document.getElementById("rs").onclick=dibujar;dibujar()}

function at(x,y,r,s,lbl=true){const c=AC[s]||"#999";return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.28}" fill="#fff" opacity=".35"/>${lbl?`<text x="${x}" y="${y+r*.32}" text-anchor="middle" font-family="var(--mono)" font-weight="700" font-size="${Math.round(r*.85)}" fill="${OSC.includes(s)?"#fff":"#222"}">${s}</text>`:""}</g>`}

function bohr(cx,cy,conf,s,glow){const radios=[30,50,70];let h="";conf.forEach((n,i)=>{const r=radios[i],ult=i===conf.length-1;
  h+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${glow&&ult?"#F2A93B":"var(--soft)"}" stroke-width="${glow&&ult?4:1.5}" ${glow&&ult?'style="filter:drop-shadow(0 0 6px #F2A93B)"':""}/>`;
  h+=`<g class="gira" style="transform-origin:${cx}px ${cy}px;animation-duration:${8+i*5}s">`;for(let k=0;k<n;k++){const t=k*2*Math.PI/n-Math.PI/2;h+=`<circle cx="${cx+r*Math.cos(t)}" cy="${cy+r*Math.sin(t)}" r="5" fill="#2F6BFF"/>`}h+="</g>"});
  return h+at(cx,cy,17,s)}
